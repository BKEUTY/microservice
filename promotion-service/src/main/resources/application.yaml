spring:
  application:
    name: promotion-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/bkeuty-promotion}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:yasuo20gg}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
server:
  port: 8084

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

springdoc:
  api-docs:
    path: /api/promotion/v3/api-docs

