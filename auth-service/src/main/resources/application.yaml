spring:
  application:
    name: auth-service


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
server:
  port: 8083

springdoc:
  api-docs:
    path: /api/auth/v3/api-docs
