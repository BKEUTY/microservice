spring:
  application:
    name: product
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/bkeuty-product}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:yasuo20gg}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Redis configuration for caching
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

#    defer-datasource-initialization: true
#  sql:
#    init:
#      mode: always
  kafka:
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wrap the JsonDeserializer inside the ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.bkeuty.*"
        spring.json.type.mapping: "com.bkeuty.order.dto.order.DecreaseStockRequestDto:com.bkeuty.product.dto.user.order.DecreaseStockRequestDto"
      group-id: "product-service-group"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  cloudinary:
    cloud-name: ${CLOUDINARY_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  #  cloud-name: dyzcl7cbe
  #  api-key: 643964737283187
  #  api-secret: W4zCsQq3qscuxqFWUpW3es4rQMs

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# Gemini API configuration
gemini:
  api-key: ${GEMINI_API_KEY:}

server:
  port: 8081

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

springdoc:
  api-docs:
    path: /api/product/v3/api-docs

service-base-url:
  auth-service: ${AUTH_SERVICE_URL:http://auth-service}
  promotion-service: ${PROMOTION_SERVICE_URL:http://promotion-service}
  review-service: ${REVIEW_SERVICE_URL:http://review-service}
  order-service: ${ORDER_SERVICE_URL:http://order}



