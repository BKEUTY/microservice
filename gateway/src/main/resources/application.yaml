spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          httpclient:
            connect-timeout: 10000
            response-timeout: 180s
          routes:
            - id: block-internal
              uri: no://op
              predicates:
                - Path= /api/*/internal/**
              filters:
                - SetStatus=403

            - id: product-service
#              uri: lb://product
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path= /api/product/**, /api/category/**, /api/brand/**, /api/admin/product/**, /api/admin/category/**, /api/admin/brand/**
              filters:
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Methods
                - RemoveResponseHeader=Access-Control-Allow-Headers
                - RemoveResponseHeader=Access-Control-Allow-Credentials

            - id: order-service
#              uri: lb://order
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path= /api/order/**,/api/cart/**, /api/admin/order/**, /api/admin/cart/**, /api/admin/dashboard/**, /api/admin/reports/**, /api/admin/refund-order/**
              filters:
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Methods
                - RemoveResponseHeader=Access-Control-Allow-Headers
                - RemoveResponseHeader=Access-Control-Allow-Credentials
            - id: payment-service
#              uri: lb://payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path= /api/payment/**
              filters:
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Methods
                - RemoveResponseHeader=Access-Control-Allow-Headers
                - RemoveResponseHeader=Access-Control-Allow-Credentials
            - id: shipping-service
#              uri: lb://shipping-service
              uri: ${SHIPPING_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path= /api/shipping/**, /api/address/**
              filters:
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Methods
                - RemoveResponseHeader=Access-Control-Allow-Headers
                - RemoveResponseHeader=Access-Control-Allow-Credentials
            - id: auth-service
#              uri: lb://auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path= /api/auth/**
              filters:
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Methods
                - RemoveResponseHeader=Access-Control-Allow-Headers
                - RemoveResponseHeader=Access-Control-Allow-Credentials
            - id: promotion-service
#              uri: lb://promotion-service
              uri: ${PROMOTION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path= /api/promotion/**, /api/admin/promotion/**
              filters:
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Methods
                - RemoveResponseHeader=Access-Control-Allow-Headers
                - RemoveResponseHeader=Access-Control-Allow-Credentials
            - id: review-service
#              uri: lb://review-service
              uri: ${REVIEW_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path= /api/review/**, /api/user/reviews/**, /api/admin/reviews/**, /api/reviews/**
              filters:
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Methods
                - RemoveResponseHeader=Access-Control-Allow-Headers
                - RemoveResponseHeader=Access-Control-Allow-Credentials
            - id: user-service
#              uri: lb://user-service
              uri: ${USER_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path= /api/user/** , /api/admin/user/**
              filters:
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Methods
                - RemoveResponseHeader=Access-Control-Allow-Headers
                - RemoveResponseHeader=Access-Control-Allow-Credentials
            - id: chatbot-service
              uri: lb://chatbot-service
              predicates:
                - Path= /api/chatbot/**
              filters:
                - RemoveResponseHeader=Access-Control-Allow-Origin
                - RemoveResponseHeader=Access-Control-Allow-Methods
                - RemoveResponseHeader=Access-Control-Allow-Headers
                - RemoveResponseHeader=Access-Control-Allow-Credentials
eureka:
  client:
    service-url:
      enabled: ${EUREKA_ENABLED:false}
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Product Service
        url: /api/product/v3/api-docs
      - name: Order Service
        url: /api/order/v3/api-docs
      - name: Auth Service
        url: /api/auth/v3/api-docs
      - name: User Service
        url: /api/user/v3/api-docs
      - name: Promotion Service
        url: /api/promotion/v3/api-docs
      - name: Review Service
        url: /api/review/v3/api-docs
      - name: Payment Service
        url: /api/payment/v3/api-docs
      - name: Shipping Service
        url: /api/shipping/v3/api-docs
      - name: Chatbot Service
        url: /api/chatbot/v3/api-docs
logging:
  level:
    root: INFO
    org:
      springframework:
        cloud:
          gateway:
            route:
              RouteDefinitionLocator: INFO

server:
  port: 8080

