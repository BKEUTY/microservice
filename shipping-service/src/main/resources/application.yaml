spring:
  application:
    name: shipping-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/bkeuty-shipping}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:yasuo20gg}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: "shipping-service-group"
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.bkeuty.*"
        spring:
          json:
            type:
              mapping: "com.bkeuty.order.dto.shipping.CreateShippingOrderMessage:com.bkeuty.shipping_service.dto.CreateShippingOrderMessage"

server:
  port: 8087

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

springdoc:
  api-docs:
    path: /api/shipping/v3/api-docs
